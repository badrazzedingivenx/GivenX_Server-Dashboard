<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Log to stdout/stderr so Render captures them
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
